# ============================================
# MediFind - application.properties
# ============================================

# Server
server.port=8080

# MySQL Database - CHANGE these to your MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/medifind?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret Key (change this to a long random string in production)
jwt.secret=medifind_super_secret_key_change_this_in_production_2024
jwt.expiration=86400000

# CORS - Allow React frontend
spring.web.cors.allowed-origins=http://localhost:3000

# Google Maps API Key - GET FROM https://console.cloud.google.com
google.maps.api.key=AIzaSyA9ysxLrAUYX1ILu-RpEoO7onf5ZpaoVgk

# Razorpay Payment Gateway - GET FROM https://razorpay.com
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET

# Nearby search radius in km
medifind.search.radius.km=3

# Local development administrator (change these before deployment)
medifind.admin.email=admin@medifind.com
medifind.admin.password=admin123
